<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rocket line-up with 3D viewer (mockup)</title>
<style>
:root{
  --bg:#050913; --panel:#0a1020; --line:#1a2440; --line2:#121a30; --text:#e7ebf5; --muted:#8a94ad; --dim:#5c6784;
  --sil:#5d6e90; --sil-hi:#8da0c6; --accent:#1e90ff; --accent-soft:rgba(30,144,255,.14);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
html.locked{overflow:hidden}
a{color:inherit}
button{font:inherit;color:inherit}

/* --- site chrome (mock) --- */
.nav{display:flex;align-items:center;gap:28px;padding:14px 28px;border-bottom:1px solid var(--line2);font-size:14px}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em}
.nav .links{display:flex;gap:22px;color:#c6cde0}
.nav .search{margin-left:auto;border:1px solid var(--line);border-radius:999px;padding:7px 14px;color:var(--muted);min-width:260px;font-size:13px}
@media (max-width:760px){.nav .links,.nav .search{display:none}}

main{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
.mocknote{font:12px var(--mono);color:var(--dim);margin:0 0 10px}

/* --- line-up module --- */
.module{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 18px 4px;container-type:inline-size}
.eyebrow{font:600 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.module h1{font-size:23px;line-height:1.25;letter-spacing:-.015em;margin:8px 0 14px}
.hint{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 10px 4px 8px;margin-bottom:6px}
.hint svg{width:14px;height:14px}
#chart{width:100%;min-height:380px}
#chart svg{display:block;overflow:visible}
#chart .grid{stroke:var(--line);stroke-width:1}
#chart .axis{fill:var(--muted);font-size:11px}
#chart .rocket{cursor:pointer;outline:none}
#chart .hit{fill:transparent}
#chart .sil{fill:var(--sil);transition:fill .2s}
#chart .sil .detail path, .ghost .detail path, #strip .detail path, .lying-inner .detail path{fill:none;stroke:#161826;stroke-opacity:.45;stroke-width:.25}
#chart .val{fill:#c3cadb;font:11px var(--mono);text-anchor:middle;transition:opacity .2s}
#chart .name{fill:#c3cadb;font-size:12px;text-anchor:middle}
#chart .pill{opacity:0;transition:opacity .2s, transform .2s;pointer-events:none}
#chart .pill rect{fill:var(--accent)}
#chart .pill text{fill:#fff;font:600 10px var(--sans);text-anchor:middle}
#chart .rocket:hover .sil,#chart .rocket:focus-visible .sil{fill:var(--sil-hi)}
#chart .rocket:hover .pill,#chart .rocket:focus-visible .pill{opacity:1}
#chart .rocket:hover .val,#chart .rocket:focus-visible .val{opacity:0}
#chart .rocket:focus-visible .hit{stroke:var(--accent);stroke-dasharray:3 3}
#chart .featured .sil{fill:var(--accent)}
#chart .featured .name,#chart .featured .val{fill:var(--accent);font-weight:700}
#chart .nohe rect{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 4}
#chart .nohe .q{fill:var(--accent);font:700 20px var(--sans);text-anchor:middle}
#chart .nohe .name{fill:var(--text);font-weight:700}
#chart .nohe .sub{fill:var(--muted);font-size:12px;text-anchor:middle}

#ranked{display:none;flex-direction:column;gap:2px;margin:4px 0 6px}
.row{display:grid;grid-template-columns:96px 1fr 52px;align-items:center;gap:10px;background:none;border:0;padding:6px 0;text-align:left;cursor:pointer;border-radius:6px}
.row:hover{background:#0e1630}
.rname{font-size:12.5px;color:#c3cadb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rval{font:12px var(--mono);color:#c3cadb;text-align:right}
.track{display:block}
.track svg{display:block;height:auto;fill:var(--sil);overflow:visible}
.track .detail path{fill:none;stroke:#161826;stroke-opacity:.45;stroke-width:.25}
.row.featured .rname{color:var(--text);font-weight:700}
.row.featured .track svg{fill:var(--accent)}
.row:hover .track svg{fill:var(--sil-hi)}

.caption{font-size:13px;line-height:1.5;color:#aab3c8;margin:6px 0 14px}
.stats{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line)}
.stat{padding:12px 0 14px;border-right:1px solid var(--line);padding-left:12px}
.stat:first-child{padding-left:0}.stat:last-child{border-right:0}
.stat-label{font:600 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:#aab3c8;margin-bottom:4px}
.stat-value{font-size:24px;letter-spacing:-.01em}
.stat-value span{font-size:12px;color:var(--muted);margin-left:3px}
.stat-na{font-size:13px;color:var(--muted);padding-top:6px}

@container (max-width:672px){
  #chart{display:none} #ranked{display:flex}
  .stats{grid-template-columns:1fr 1fr}
  .stat{border-right:0;padding-left:0;border-bottom:1px solid var(--line)}
  .stat:nth-child(odd){border-right:1px solid var(--line)} .stat:nth-child(even){padding-left:12px}
  .module h1{font-size:21px}
}

/* --- ghost silhouette for the hand-off --- */
.ghost{position:fixed;z-index:60;fill:var(--sil-hi);pointer-events:none;transform-origin:50% 50%;will-change:transform}
.ghost.featured{fill:var(--accent)}

/* --- viewer --- */
#viewer{position:fixed;inset:0;z-index:50;display:grid;grid-template-columns:1fr 400px;
  background:radial-gradient(120% 90% at 35% 100%,#0d1a38 0%,#060b18 55%,#04070f 100%)}
#viewer[hidden]{display:none}
#viewer{opacity:0;transition:opacity .35s ease}
#viewer.in{opacity:1}
#stage{position:relative;min-height:0;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
.vtop{position:absolute;top:16px;left:16px;right:16px;display:flex;align-items:center;gap:10px;z-index:2;pointer-events:none}
.vtop>*{pointer-events:auto}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:rgba(10,16,32,.7);backdrop-filter:blur(8px);cursor:pointer;font-size:13px}
.btn:hover{border-color:#2c3a62}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.btn:disabled{opacity:.35;cursor:default}
.btn svg{width:15px;height:15px}
.tools{position:absolute;bottom:16px;left:16px;display:flex;gap:8px;z-index:2;flex-wrap:wrap}
.howto{position:absolute;bottom:22px;right:18px;font:11px var(--mono);color:var(--dim);z-index:2}
#credit{position:absolute;top:60px;left:18px;right:18px;font-size:11.5px;color:var(--muted);z-index:2;max-width:520px;line-height:1.45}
#credit a{color:#b9c6e6}

.vpanel{border-left:1px solid var(--line);background:rgba(8,13,27,.82);backdrop-filter:blur(10px);padding:22px 22px 18px;overflow:auto;
  display:flex;flex-direction:column;gap:16px;transform:translateX(30px);opacity:0;transition:transform .55s cubic-bezier(.2,.8,.2,1) .12s,opacity .4s ease .12s}
#viewer.in .vpanel{transform:none;opacity:1}
.vpanel h2{font-size:30px;letter-spacing:-.02em;margin:4px 0 0}
.vpanel .rank{color:#aab3c8;font-size:14px;line-height:1.45;margin:0}
.vpanel .stats{grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.vpanel .stat{border-right:0;padding-left:0;border-bottom:1px solid var(--line)}
.vpanel .stat:nth-child(odd){border-right:1px solid var(--line)} .vpanel .stat:nth-child(even){padding-left:14px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:0}
.facts dt{font:600 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:2px 0 0;font-size:14px}
.strip-wrap{margin-top:auto}
.strip-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
#strip{display:flex;align-items:flex-end;gap:2px;height:84px;border-bottom:1px solid var(--line);padding-bottom:2px}
#strip button{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;background:none;border:0;padding:0 1px;cursor:pointer;border-radius:4px}
#strip button:hover{background:#0e1630}
#strip svg{fill:var(--sil);width:100%;max-width:100%}
#strip button.active svg{fill:var(--accent)}
.navbtns{display:flex;gap:6px}
.navbtns .btn{height:28px;padding:0 10px}

@media (max-width:860px){
  #viewer{grid-template-columns:1fr;grid-template-rows:56vh 1fr}
  .vpanel{border-left:0;border-top:1px solid var(--line);transform:translateY(30px)}
  .vpanel h2{font-size:24px}
  .howto{display:none}
  #credit{top:58px}
}
@media (prefers-reduced-motion:reduce){ #viewer,.vpanel{transition:none} }
</style>
</head>
<body>
<header class="nav">
  <div class="brand">Rocket line-up · mockup</div>
  <nav class="links"><span>Launches</span><span>Events</span><span>Explore</span></nav>
  <div class="search">Search launches, rockets, people</div>
</header>
<main>
  <p class="mocknote">Mockup · rocket page module · sample figures</p>
  <section class="module" aria-labelledby="title">
    <div class="eyebrow">Line-up · Next 30 days</div>
    <h1 id="title"></h1>
    <div class="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="m3 7 9 5 9-5M12 12v10"/></svg>Select a rocket to explore it in 3D</div>
    <div id="chart"></div>
    <div id="ranked"></div>
    <p class="caption" id="caption"></p>
    <div class="stats" id="stats"></div>
  </section>
</main>

<div id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="v-name">
  <div id="stage">
    <canvas id="gl" aria-label="3D model. Drag to rotate, scroll or pinch to zoom."></canvas>
    <div class="vtop">
      <button class="btn" id="v-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>Line-up</button>
    </div>
    <div id="credit"></div>
    <div class="tools">
      <button class="btn" id="btn-reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Reset view</button>
      <button class="btn" id="btn-spin" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="10" ry="4"/><path d="M12 2v20"/></svg>Spin</button>
      <button class="btn" id="btn-person" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="2.5"/><path d="M12 8v7m0 0-3 6m3-6 3 6M8 11h8"/></svg>Human scale</button>
    </div>
    <div class="howto">Drag to rotate · Scroll to zoom · Right-drag to pan · Esc to close</div>
  </div>
  <aside class="vpanel">
    <div>
      <div class="eyebrow" id="v-eyebrow"></div>
      <h2 id="v-name"></h2>
    </div>
    <p class="rank" id="v-rank"></p>
    <div class="stats" id="v-stats"></div>
    <dl class="facts" id="v-facts"></dl>
    <div class="strip-wrap">
      <div class="strip-head"><span class="eyebrow">Line-up</span>
        <div class="navbtns"><button class="btn" id="v-prev" aria-label="Taller rocket">‹</button><button class="btn" id="v-next" aria-label="Shorter rocket">›</button></div>
      </div>
      <div id="strip"></div>
    </div>
  </aside>
</div>
