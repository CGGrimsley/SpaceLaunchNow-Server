<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rocket line-up with 3D viewer (mockup)</title>
<style>
:root{background:#050913}
*{box-sizing:border-box}
body{margin:0;background:#050913;color:#e7ebf5;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
/* --- site chrome (mock) --- */
.nav{display:flex;align-items:center;gap:28px;padding:14px 28px;border-bottom:1px solid var(--line2);font-size:14px}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em}
.nav .links{display:flex;gap:22px;color:#c6cde0}
.nav .search{margin-left:auto;border:1px solid var(--line);border-radius:999px;padding:7px 14px;color:var(--muted);min-width:260px;font-size:13px}
@media (max-width:760px){.nav .links,.nav .search{display:none}}

main{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
.mocknote{font:12px var(--mono);color:var(--dim);margin:0 0 10px}

.mocknote{font:12px ui-monospace,Menlo,monospace;color:#5c6784;margin:0 0 10px}
.nav{border-bottom-color:#121a30}.nav .search{border-color:#1a2440;color:#8a94ad}
</style>
<style>/*CSS*/</style>
</head>
<body>
<header class="nav">
  <div class="brand">Rocket line-up · mockup</div>
  <nav class="links"><span>Launches</span><span>Events</span><span>Explore</span></nav>
  <div class="search">Search launches, rockets, people</div>
</header>
<main>
  <p class="mocknote">Mockup · rocket page module · sample figures</p>
  <!--MODULE-->
</main>

<script>/*APP*/</script>
</body>
</html>
